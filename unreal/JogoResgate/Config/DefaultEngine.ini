[/Script/Engine.RendererSettings]
; 0 = None (sem Lumen GI) | reflexões em Screen Space. Reavaliar em M3 (ADR-004).
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=True
; Estilo cartunesco (A-004): desliga recursos caros que não agregam ao visual.
r.GenerateMeshDistanceFields=False
r.Nanite.ProjectEnabled=False
r.DefaultFeature.AutoExposure=False
; Exposição fixa (A-050): sem adaptação do olho e sem exposição local, o céu não escurece/clareia
; conforme a direção da câmera. Cada mapa tem ainda o PostProcessVolume "ExposicaoFixa" (setup_alien_sky.py).
r.DefaultFeature.LocalExposure.HighlightContrastScale=1.0
r.DefaultFeature.LocalExposure.ShadowContrastScale=1.0
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
; TAA (2) é mais leve que TSR (4) e suficiente para cartoon
r.AntiAliasingMethod=2

